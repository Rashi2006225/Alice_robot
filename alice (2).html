<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALICE — Service Robot Avatar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#0F151B; --panel:#161F27; --panel-2:#1C2732;
    --line:rgba(255,255,255,0.08); --text:#E7ECEF; --muted:#7C8B99;
    --cyan:#5EEAD4; --amber:#F5A65B; --red:#E8677A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, rgba(94,234,212,0.06), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(245,166,91,0.05), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:28px; min-height:100%;
  }
  .kiosk{
    width:100%; max-width:900px; background:var(--panel);
    border:1px solid var(--line); border-radius:20px; overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--line);
  }
  .brand{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:19px; letter-spacing:0.02em;}
  .brand span{color:var(--cyan);}
  .brand-sub{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); margin-top:2px; letter-spacing:0.04em;}
  .status-dot{display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted);}
  .status-dot.error #statusText{color:var(--red);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background .2s, box-shadow .2s;}
  .dot.on{background:var(--cyan); box-shadow:0 0 10px var(--cyan);}

  .pipeline{display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line);}
  .stage{
    padding:12px 10px; text-align:center; font-family:'JetBrains Mono', monospace;
    font-size:10.5px; letter-spacing:0.06em; color:var(--muted);
    border-right:1px solid var(--line); background:var(--panel);
    transition:background .25s, color .25s;
  }
  .stage:last-child{border-right:none;}
  .stage b{display:block; font-size:9px; font-weight:400; opacity:0.6; margin-bottom:3px;}
  .stage.active{color:var(--bg); background:var(--cyan);}
  .stage.active.think, .stage.active.speak{background:var(--amber);}

  .main{display:grid; grid-template-columns:280px 1fr; min-height:420px;}
  @media (max-width:640px){ .main{grid-template-columns:1fr;} }

  .avatar-panel{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:32px 20px; border-right:1px solid var(--line); background:var(--panel-2);
  }
  @media (max-width:640px){ .avatar-panel{border-right:none; border-bottom:1px solid var(--line);} }

  .avatar-wrap{position:relative; width:180px; height:180px;}
  .ring{position:absolute; inset:0; border-radius:50%; border:1px solid var(--cyan); opacity:0;}
  .ring.pulse{animation:pulse 1.6s ease-out infinite;}
  @keyframes pulse{
    0%{transform:scale(0.85); opacity:0.6;}
    100%{transform:scale(1.35); opacity:0;}
  }
  #face{width:180px; height:180px; display:block;}
  #eyeL, #eyeR{transform-box:fill-box; transform-origin:center; transition:transform .08s;}
  #eyeL.blink, #eyeR.blink{transform:scaleY(0.12);}

  .mic-btn{
    width:64px; height:64px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .2s;
  }
  .mic-btn:hover:not(:disabled){border-color:var(--cyan);}
  .mic-btn:disabled{cursor:default;}
  .mic-btn.listening{background:var(--cyan); border-color:var(--cyan);}
  .mic-btn.listening svg{stroke:var(--bg);}
  .mic-btn svg{width:24px; height:24px; stroke:var(--text); fill:none; stroke-width:1.6;}

  .hint{font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted); text-align:center; letter-spacing:0.03em;}

  .convo-panel{display:flex; flex-direction:column; padding:20px 22px;}
  .convo-title{font-family:'Space Grotesk', sans-serif; font-size:13px; color:var(--muted); letter-spacing:0.04em; margin-bottom:14px;}
  .log{flex:1; display:flex; flex-direction:column; gap:10px; overflow-y:auto; max-height:340px; padding-right:4px;}
  .bubble{max-width:82%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.45;}
  .bubble.user{align-self:flex-end; background:var(--panel-2); border:1px solid var(--line); border-bottom-right-radius:3px;}
  .bubble.bot{align-self:flex-start; background:rgba(94,234,212,0.08); border:1px solid rgba(94,234,212,0.25); border-bottom-left-radius:3px;}
  .bubble .who{font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--muted); margin-bottom:4px; letter-spacing:0.05em;}
  .empty-log{color:var(--muted); font-size:13px; margin:auto 0; text-align:center; font-family:'JetBrains Mono', monospace;}
  .bubble.live{opacity:.7; font-style:italic;}
  .bubble.streaming::after{content:'▍'; margin-left:2px; color:var(--cyan); animation:caret 1s steps(1) infinite;}
  @keyframes caret{50%{opacity:0;}}
  .log::-webkit-scrollbar{width:6px;}
  .log::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .unsupported{
    margin:18px 22px 0; padding:12px 14px; border:1px solid rgba(232,103,122,0.35);
    background:rgba(232,103,122,0.08); color:var(--red); border-radius:10px;
    font-size:12.5px; display:none;
  }
</style>
</head>
<body>

<div class="kiosk">
  <div class="topbar">
    <div>
      <div class="brand">ALICE <span>· service robot avatar</span></div>
      <div class="brand-sub">STT → NLP INTENT → TTS DEMO</div>
    </div>
    <div class="status-dot" id="statusWrap"><span class="dot" id="listenDot"></span><span id="statusText">idle</span></div>
  </div>

  <div class="pipeline">
    <div class="stage" data-stage="listen"><b>01</b>LISTEN</div>
    <div class="stage" data-stage="understand"><b>02</b>UNDERSTAND</div>
    <div class="stage" data-stage="think"><b>03</b>THINK</div>
    <div class="stage" data-stage="speak"><b>04</b>SPEAK</div>
  </div>

  <div class="unsupported" id="unsupportedMsg">
    This browser does not support microphone recording. Please open this demo in Chrome, Edge or Firefox.
  </div>

  <div class="main">
    <div class="avatar-panel">
      <div class="avatar-wrap">
        <div class="ring" id="ring1"></div>
        <div class="ring" id="ring2"></div>
        <svg id="face" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="92" fill="#101820" stroke="#28343E" stroke-width="2"/>
          <circle cx="68" cy="86" r="7" fill="#5EEAD4" id="eyeL"/>
          <circle cx="132" cy="86" r="7" fill="#5EEAD4" id="eyeR"/>
          <path id="mouth" d="M 70 130 Q 100 130 130 130" stroke="#5EEAD4" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <button class="mic-btn" id="micBtn" title="Tap once to start the conversation">
        <svg viewBox="0 0 24 24">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path d="M19 11a7 7 0 0 1-14 0"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
        </svg>
      </button>
      <div class="hint" id="hintText">TAP MIC TO START</div>
    </div>

    <div class="convo-panel">
      <div class="convo-title">Conversation log</div>
      <div class="log" id="log">
        <div class="empty-log">No conversation yet.<br>Tap the mic once and say "hello".</div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

/* =====================================================================
 * CONFIG
 * Backend contract:
 *   POST /transcribe  multipart 'audio'      -> { text }
 *   POST /chat        JSON { message }       -> STREAMED text/plain (chunks)
 *   POST /tts         JSON { text }          -> audio blob (OPTIONAL; if it
 *                     fails, browser speechSynthesis is used as fallback)
 * ===================================================================== */
const API_BASE = 'http://127.0.0.1:8000';
const URLS = {
  stt:  `${API_BASE}/transcribe`,
  chat: `${API_BASE}/chat`,
  tts:  `${API_BASE}/tts`,
};

const SILENCE_MS = 2000;   // auto-stop after this much silence
const MIN_BLOB_BYTES = 1000; // anything smaller is treated as an empty recording
const LIVE_CAPTIONS = false;  // true = show your words while speaking (can steal the mic on some PCs/browsers)
const LIVE_CAPTION_LANG = 'en-IN'; // language for the live "as you speak" captions (use 'hi-IN' for Hindi)
const MIN_CHUNK = 30;      // min characters per spoken chunk (avoids choppy one-word TTS calls)
const VAD = {
  tickMs: 50,          // how often the mic level is sampled
  minThreshold: 0.02,  // absolute RMS floor for "voice"
  noiseMult: 3,        // voice must be this many times above ambient noise
  voiceStartMs: 120,   // sustained loudness needed to count as speech
  bargeMs: 250,        // sustained loudness needed to interrupt Alice
  bargeBoost: 1.6,     // higher threshold while Alice talks (speaker echo)
};

/* =====================================================================
 * STATE MACHINE
 * IDLE -> LISTENING -> PROCESSING -> SPEAKING -> LISTENING ...
 * Barge-in: PROCESSING/SPEAKING -> LISTENING
 * ===================================================================== */
const S = { IDLE:'IDLE', LISTENING:'LISTENING', PROCESSING:'PROCESSING', SPEAKING:'SPEAKING' };

const TRANSITIONS = {
  IDLE:       [S.LISTENING],
  LISTENING:  [S.PROCESSING, S.IDLE],
  PROCESSING: [S.SPEAKING, S.LISTENING, S.IDLE],
  SPEAKING:   [S.LISTENING, S.IDLE],
};

// What the UI shows in each state (only text/indicators change, not the design)
const STATE_UI = {
  IDLE:       { status:'idle',                    hint:'TAP MIC TO START',      stage:null },
  LISTENING:  { status:'🎤 Listening...',          hint:'LISTENING… JUST SPEAK', stage:'listen' },
  PROCESSING: { status:'🤔 Thinking...',           hint:'PROCESSING…',           stage:'understand' },
  SPEAKING:   { status:'🗣 Alice is speaking...',  hint:'SPEAK TO INTERRUPT',    stage:'speak' },
};

let state = S.IDLE;
const history = [];           // conversation memory: [{ role:'user'|'assistant', content }]
const MAX_HISTORY = 20;       // messages kept (10 back-and-forths)
let turnId = 0;               // bumps on every new listening turn; stale work compares against it
let apiController = null;     // AbortController for the in-flight /transcribe or /chat

/* =====================================================================
 * UI HELPERS
 * ===================================================================== */
const $ = (id) => document.getElementById(id);
const micBtn = $('micBtn'), statusText = $('statusText'), statusWrap = $('statusWrap');
const listenDot = $('listenDot'), log = $('log'), hintText = $('hintText'), mouth = $('mouth');
const rings = [$('ring1'), $('ring2')];
const stages = document.querySelectorAll('.stage');
$('ring2').style.animationDelay = '0.5s';

function setStage(name) {
  stages.forEach((s) => {
    const on = s.dataset.stage === name;
    s.classList.toggle('active', on);
    s.classList.toggle('think', on && name === 'think');
    s.classList.toggle('speak', on && name === 'speak');
  });
}

function setStatus(text, isError = false) {
  statusText.textContent = text;
  statusWrap.classList.toggle('error', isError);
}

// textContent (not innerHTML) so transcripts/LLM text can never inject markup
function createBubble(who, text = '') {
  log.querySelector('.empty-log')?.remove();
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (who === 'You' ? 'user' : 'bot');
  const label = document.createElement('div');
  label.className = 'who';
  label.textContent = who;
  const node = document.createTextNode(text);
  bubble.append(label, node);
  log.appendChild(bubble);
  log.scrollTop = log.scrollHeight;
  return {
    el: bubble,
    set(t) { node.nodeValue = t; log.scrollTop = log.scrollHeight; },
    get()  { return node.nodeValue; },
  };
}

// Strip markdown-ish symbols the model might still emit, and collapse whitespace
function cleanForSpeech(t) {
  return t.replace(/[*#_`|<>~]/g, '').replace(/\s+/g, ' ');
}

// Split streamed text into speakable chunks at sentence ends. Returns { chunks, rest }.
function splitSpeakable(buf) {
  const re = /[.!?।]+["')\]]*\s+/g;
  const chunks = [];
  let start = 0, m;
  while ((m = re.exec(buf))) {
    const end = m.index + m[0].length;
    if (end - start < MIN_CHUNK) continue;   // too short: merge with the next sentence
    chunks.push(buf.slice(start, end));
    start = end;
  }
  return { chunks, rest: buf.slice(start) };
}

// Mouth animation runs only while SPEAKING
let mouthRaf = null;
function animateMouth(active) {
  cancelAnimationFrame(mouthRaf);
  mouthRaf = null;
  if (active) {
    let t = 0;
    const loop = () => {
      t += 0.35;
      const open = Math.abs(Math.sin(t)) * 18 + 4;
      mouth.setAttribute('d', `M 70 128 Q 100 ${128 + open} 130 128`);
      mouthRaf = requestAnimationFrame(loop);
    };
    loop();
  } else {
    mouth.setAttribute('d', 'M 70 130 Q 100 130 130 130');
  }
}

// Idle blink
const eyes = [$('eyeL'), $('eyeR')];
const blinkTimer = setInterval(() => {
  eyes.forEach((e) => e.classList.add('blink'));
  setTimeout(() => eyes.forEach((e) => e.classList.remove('blink')), 140);
}, 4200);

/**
 * Move the state machine to `next` and apply all UI side effects.
 * `message` optionally overrides the status text (used for friendly errors).
 */
function setState(next, message = null, isError = false) {
  if (next !== state && !TRANSITIONS[state].includes(next)) {
    console.warn(`Illegal transition ${state} -> ${next}`);
    return;
  }
  state = next;
  const ui = STATE_UI[next];
  setStage(ui.stage);
  setStatus(message || ui.status, isError);
  hintText.textContent = ui.hint;
  micBtn.classList.toggle('listening', next === S.LISTENING);
  micBtn.disabled = next !== S.IDLE;              // mic only *starts* a session; no stop button
  listenDot.classList.toggle('on', next === S.LISTENING);
  rings.forEach((r) => r.classList.toggle('pulse', next === S.LISTENING));
  animateMouth(next === S.SPEAKING);
}

// Go back to IDLE with a friendly message (stops the auto-loop on failures)
function fail(message) {
  apiController?.abort();
  Playback.stop();
  stopLiveCaption();
  dropLiveBubble();
  setState(S.IDLE, '⚠️ ' + message, true);
}

/* =====================================================================
 * API LAYER — every call takes an AbortSignal
 * ===================================================================== */
class AppError extends Error {}

// fetch wrapper that converts failures into friendly AppErrors (aborts pass through)
async function request(url, options, signal, errors) {
  let res;
  try {
    res = await fetch(url, { ...options, signal });
  } catch (err) {
    if (err.name === 'AbortError') throw err;
    throw new AppError(errors.network);   // backend down / offline / CORS
  }
  if (!res.ok) {
    let detail = '';
    // CHANGE: .error ke saath .detail bhi padha.
    // WHY: FastAPI error "detail" naam se bhejta hai, to console mein asli wajah dikhti hai.
    try { const j = await res.clone().json(); detail = String(j.error || j.detail || ''); } catch (_) { /* not JSON */ }
    console.error(`${url} -> ${res.status}`, detail);
    throw new AppError(errors.http);
  }
  return res;
}

async function transcribe(blob, signal) {
  const ext = blob.type.includes('mp4') ? 'mp4' : blob.type.includes('ogg') ? 'ogg' : 'webm';
  const form = new FormData();
  form.append('audio', blob, `recording.${ext}`);
  const res = await request(URLS.stt, { method:'POST', body:form }, signal, {
    network: "Can't reach the server. Is the backend running?",
    http: "I couldn't understand the audio (speech-to-text failed). Please try again.",
  });
  const data = await res.json();
  return (data.text || '').trim();
}

/** Streams the reply: calls onChunk(text) for every piece as it arrives. Resolves with the full text. */
async function chatStream(message, signal, onChunk, hist = []) {
  const res = await request(URLS.chat, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ message, history: hist }),
  }, signal, {
    network: "Can't reach the server. Is the backend running?",
    http: "I'm having trouble thinking right now. Please try again.",
  });
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let full = '';
  while (true) {
    const { done, value } = await reader.read();   // rejects with AbortError if the turn is cancelled
    if (done) break;
    const chunk = decoder.decode(value, { stream:true });
    if (!chunk) continue;
    full += chunk;
    onChunk(chunk);
  }
  const tail = decoder.decode();
  if (tail) { full += tail; onChunk(tail); }
  if (!full.trim()) throw new AppError('I got an empty answer. Please try again.');
  return full;
}

async function fetchSpeechAudio(text, signal) {
  const res = await request(URLS.tts, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ text }),
  }, signal, { network:'tts unreachable', http:'tts failed' });
  const blob = await res.blob();
  if (!blob.size) throw new AppError('tts empty');
  return blob;
}

/* =====================================================================
 * PLAYBACK — exactly one audio instance, object URLs always released
 * ===================================================================== */
const Playback = (() => {
  let audio = null;        // the single <audio> element
  let objectUrl = null;    // current blob URL
  let settle = null;       // resolves the pending play() promise

  function release() {
    if (audio) {
      audio.onended = audio.onerror = null;
      audio.pause();
      audio.removeAttribute('src');
      audio.load();        // drops the media resource
    }
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  /** Stop everything immediately. Pending play() resolves with false. */
  function stop() {
    release();
    if (settle) { settle(false); settle = null; }
  }

  /** Play a Blob. Resolves true if finished naturally, false if interrupted. */
  function playBlob(blob) {
    stop();                                   // never overlap
    return new Promise((resolve, reject) => {
      audio = audio || new Audio();
      objectUrl = URL.createObjectURL(blob);
      settle = resolve;
      audio.onended = () => { release(); settle = null; resolve(true); };
      audio.onerror = () => { release(); settle = null; reject(new AppError('audio playback failed')); };
      audio.src = objectUrl;
      audio.play().catch((err) => { release(); settle = null; reject(err); });
    });
  }

  /** Fallback: browser voice. Same contract as playBlob. */
  function playBrowserVoice(text) {
    stop();
    return new Promise((resolve, reject) => {
      if (!('speechSynthesis' in window)) return reject(new AppError('no tts'));
      const utter = new SpeechSynthesisUtterance(text);
      // CHANGE: text mein Devanagari ho to 'hi-IN' voice.
      // WHY: Hindi text ko en-IN voice galat / ajeeb tareeke se padhti hai (fallback voice ke time).
      utter.lang = /[\u0900-\u097F]/.test(text) ? 'hi-IN' : 'en-IN';
      utter.rate = 0.98;
      settle = resolve;
      utter.onend = () => { settle = null; resolve(true); };
      utter.onerror = (e) => {
        settle = null;
        // 'canceled'/'interrupted' = we stopped it on purpose
        e.error === 'canceled' || e.error === 'interrupted' ? resolve(false) : reject(new AppError('tts error'));
      };
      window.speechSynthesis.speak(utter);
    });
  }

  return { stop, playBlob, playBrowserVoice };
})();

/** Start fetching TTS audio right away. Never rejects: resolves null on failure (-> browser voice fallback). */
function prefetchAudio(text, signal) {
  return fetchSpeechAudio(text, signal).catch((err) => {
    if (err.name !== 'AbortError') console.warn('Backend TTS unavailable, using browser voice:', err.message);
    return null;
  });
}

/* =====================================================================
 * RECORDER + VOICE ACTIVITY DETECTION
 * One mic stream is kept open for the whole session so we can detect
 * barge-in while Alice is talking. Tracks are released on page exit.
 * ===================================================================== */
let stream = null, audioCtx = null, analyser = null, sampleBuf = null, vadTimer = null;
let current = null;                       // { rec, parts } active MediaRecorder
let hadSpeech = false, lastVoiceAt = 0, voiceRun = 0, lastTick = 0, noiseFloor = 0.008;

function pickMimeType() {
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  return types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
}

// Open the mic once (echo cancellation helps avoid Alice hearing herself)
async function ensureMic() {
  if (stream) return;
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true },
  });
  const Ctx = window.AudioContext || window.webkitAudioContext;
  audioCtx = new Ctx();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  sampleBuf = new Float32Array(analyser.fftSize);
  lastTick = performance.now();
  vadTimer = setInterval(vadTick, VAD.tickMs);   // setInterval keeps running in background tabs
}
function startRecorder() {
  const parts = [];
  const mimeType = pickMimeType();
  const rec = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
  rec.ondataavailable = (e) => { if (e.data.size > 0) parts.push(e.data); };
  rec.start();
  current = { rec, parts };
}

/** Stop the active recorder and resolve with its Blob (or null). */
function stopRecorder() {
  return new Promise((resolve) => {
    const c = current;
    current = null;
    if (!c || c.rec.state === 'inactive') return resolve(null);
    c.rec.onstop = () => resolve(new Blob(c.parts, { type: c.rec.mimeType || 'audio/webm' }));
    c.rec.stop();
  });
}

function discardRecorder() {
  if (current && current.rec.state !== 'inactive') { current.rec.onstop = null; current.rec.stop(); }
  current = null;
}

/** Runs every VAD.tickMs: measures mic level, drives auto-stop and barge-in. */
function vadTick() {
  if (!analyser) return;
  const now = performance.now();
  const dt = now - lastTick;
  lastTick = now;

  analyser.getFloatTimeDomainData(sampleBuf);
  let sum = 0;
  for (let i = 0; i < sampleBuf.length; i++) sum += sampleBuf[i] * sampleBuf[i];
  const rms = Math.sqrt(sum / sampleBuf.length);

  // Adaptive threshold: a multiple of the ambient noise level
  let threshold = Math.max(VAD.minThreshold, noiseFloor * VAD.noiseMult);
  if (state === S.SPEAKING) threshold *= VAD.bargeBoost;
  const loud = rms > threshold;
  if (loud) voiceRun += dt;
  else { voiceRun = 0; noiseFloor = Math.min(0.05, noiseFloor * 0.95 + rms * 0.05); }

  if (state === S.LISTENING) {
    if (loud && voiceRun >= VAD.voiceStartMs) { hadSpeech = true; lastVoiceAt = now; }
    if (now - lastVoiceAt >= SILENCE_MS) finishRecording();       // Feature 1
  } else if ((state === S.SPEAKING || state === S.PROCESSING) && voiceRun >= VAD.bargeMs) {
    bargeIn();                                                    // Feature 3
  }
}

/* =====================================================================
 * CONVERSATION FLOW
 * ===================================================================== */

/* ---------- LIVE CAPTIONS: show your words on screen while you are still speaking ----------
 * Uses the browser's SpeechRecognition (Chrome/Edge/Safari) purely for the live preview.
 * When recording ends, the accurate Groq transcript replaces it. If the browser has no
 * SpeechRecognition (e.g. Firefox), nothing is shown live and the Groq text appears afterwards. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, liveBubble = null, liveText = '', liveCommitted = '';

function showLive(text) {
  if (!text) return;
  liveText = text;
  if (!liveBubble) { liveBubble = createBubble('You'); liveBubble.el.classList.add('live'); }
  liveBubble.set(text);
}
function dropLiveBubble() { liveBubble?.el.remove(); liveBubble = null; liveText = ''; }
function commitUserBubble(text) {
  if (!liveBubble) liveBubble = createBubble('You');
  liveBubble.el.classList.remove('live');
  liveBubble.set(text);
  liveBubble = null; liveText = '';
}
function startLiveCaption() {
  stopLiveCaption();
  if (!LIVE_CAPTIONS || !SR) return;
  liveText = liveCommitted = '';
  const r = new SR();
  r.lang = LIVE_CAPTION_LANG;
  r.continuous = true;
  r.interimResults = true;
  r.onresult = (e) => {
    if (recog !== r) return;
    let t = '';
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    showLive((liveCommitted + ' ' + t).trim());
  };
  r.onerror = (e) => {                       // anything serious: stop captions, recording still works
    if (e.error !== 'no-speech' && e.error !== 'aborted' && recog === r) recog = null;
  };
  r.onend = () => {                          // Chrome ends sessions on pauses: keep going while listening
    if (recog !== r) return;
    liveCommitted = liveText;
    try { r.start(); } catch (_) { recog = null; }
  };
  recog = r;
  try { r.start(); } catch (_) { recog = null; }
}
function stopLiveCaption() {
  const r = recog; recog = null;
  if (r) { try { r.stop(); } catch (_) { /* already stopped */ } }
}

/* ---------- STREAM THE REPLY: text appears live, voice starts after the first sentence ---------- */
async function streamAndSpeak(message, signal, stale) {
  const bubble = createBubble('ALICE');
  bubble.el.classList.add('streaming');
  const queue = [];                          // { text, audio: Promise<Blob|null> } in speaking order
  let streamDone = false, wake = null;
  const notify = () => { if (wake) { wake(); wake = null; } };

  const enqueue = (raw) => {
    const text = cleanForSpeech(raw).trim();
    if (!/[\p{L}\p{N}]/u.test(text)) return;                 // nothing speakable
    queue.push({ text, audio: prefetchAudio(text, signal) }); // TTS fetch starts immediately
    notify();
  };

  // Producer: read the stream, grow the bubble, cut finished sentences for TTS
  const producer = (async () => {
    let pending = '', full = '';
    try {
      await chatStream(message, signal, (chunk) => {
        full += chunk;
        pending += chunk;
        bubble.set(cleanForSpeech(full).trimStart());
        const { chunks, rest } = splitSpeakable(pending);
        pending = rest;
        chunks.forEach(enqueue);
      }, history.slice());                     // send earlier turns (current message is not in it yet)
      if (pending.trim()) enqueue(pending);   // last sentence without trailing space
      // Remember this exchange for the next question
      history.push({ role:'user', content:message },
                   { role:'assistant', content:cleanForSpeech(full).trim() });
      if (history.length > MAX_HISTORY) history.splice(0, history.length - MAX_HISTORY);
    } finally {
      streamDone = true;
      notify();
    }
  })();

  // Consumer: play chunks one after another as their audio becomes ready
  const consumer = (async () => {
    while (true) {
      if (!queue.length) {
        if (streamDone) return true;
        await new Promise((r) => { wake = r; });
        continue;
      }
      const item = queue.shift();
      const blob = await item.audio;
      if (stale()) return false;
      if (state !== S.SPEAKING) setState(S.SPEAKING);
      const ok = blob ? await Playback.playBlob(blob) : await Playback.playBrowserVoice(item.text);
      if (!ok) return false;                 // interrupted (barge-in)
    }
  })();

  try {
    const [, finished] = await Promise.all([producer, consumer]);
    return finished;
  } finally {
    bubble.el.classList.remove('streaming');
    if (!bubble.get().trim()) bubble.el.remove();   // nothing arrived: don't leave an empty bubble
  }
}

/** Begin a fresh listening turn. Cancels anything still running (newest speech wins). */
function startListening(voiceAlready = false) {
  turnId++;                       // invalidates every older pending task
  apiController?.abort();         // cancel unfinished /transcribe or /chat
  apiController = null;
  Playback.stop();
  discardRecorder();
  dropLiveBubble();               // an unfinished live caption from a cancelled turn

  hadSpeech = voiceAlready;       // barge-in: user is already talking
  voiceRun = 0;
  lastVoiceAt = performance.now();
  startRecorder();
  startLiveCaption();
  setState(S.LISTENING);
}

/** User spoke over Alice / over a pending request. */
function bargeIn() {
  console.info('Barge-in');
  startListening(true);
}

/** Silence timeout reached: stop recording, upload, and run the pipeline. */
async function finishRecording() {
  const id = turnId;
  setState(S.PROCESSING);         // synchronous, so vadTick can't fire this twice
  stopLiveCaption();
  const blob = await stopRecorder();
  if (id !== turnId) return;      // barge-in happened meanwhile

  if (!hadSpeech || !blob || blob.size < MIN_BLOB_BYTES) {
    return fail(hadSpeech ? 'The recording was empty. Tap the mic and try again.'
                          : "I didn't hear anything. Tap the mic and try again.");
  }
  processTurn(blob, id);
}

/** STT -> LLM -> TTS -> back to listening. Every await re-checks staleness. */
async function processTurn(blob, id) {
  const ctrl = new AbortController();
  apiController = ctrl;
  const stale = () => id !== turnId || ctrl.signal.aborted;

  try {
    setStage('understand');
    const transcript = await transcribe(blob, ctrl.signal);
    if (stale()) return;
    if (!transcript) return fail("I couldn't catch any speech. Tap the mic and try again.");
    commitUserBubble(transcript);         // replaces the live caption with the accurate transcript

    setStage('think');
    // Reply text streams into the log; speech starts as soon as the first sentence is ready
    const finished = await streamAndSpeak(transcript, ctrl.signal, stale);
    if (stale() || !finished) return;     // interrupted: the barge-in flow took over

    startListening();                     // Feature 2: auto-resume listening
  } catch (err) {
    if (err.name === 'AbortError' || stale()) return;   // stale errors never touch the UI
    console.error(err);
    fail(err instanceof AppError ? err.message : 'Something went wrong. Please try again.');
  }
}

/* =====================================================================
 * ENTRY POINT + CLEANUP
 * ===================================================================== */
if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
  $('unsupportedMsg').style.display = 'block';
  micBtn.disabled = true;
}

micBtn.addEventListener('click', async () => {
  if (state !== S.IDLE) return;
  try {
    await ensureMic();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    startListening();
  } catch (err) {
    console.error(err);
    const denied = err.name === 'NotAllowedError' || err.name === 'SecurityError';
    fail(denied ? 'Microphone access was blocked. Please allow it and try again.'
                : 'No microphone found or it is in use by another app.');
  }
});

// Release mic, timers, audio and URLs when the page closes (no leaks)
window.addEventListener('pagehide', () => {
  clearInterval(vadTimer); clearInterval(blinkTimer);
  apiController?.abort();
  Playback.stop();
  stopLiveCaption();
  discardRecorder();
  stream?.getTracks().forEach((t) => t.stop());
  audioCtx?.close();
  stream = audioCtx = analyser = null;
});

setState(S.IDLE);
</script>
